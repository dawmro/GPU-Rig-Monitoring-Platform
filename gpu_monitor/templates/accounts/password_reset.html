{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Rig Monitor - Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
    <div class="grm-card-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-2">🖥️ GPU Rig Monitor</h1>
        <p class="text-gray-300 text-center mb-6">Reset your password</p>

        {% if form.errors %}
        <div class="grm-alert grm-alert-error mb-4">
            <p class="text-sm">Please correct the errors below.</p>
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm text-gray-300 mb-1">Email address</label>
                <input type="email" name="email" required autofocus
                    class="w-full grm-input-lg">
                {% if form.email.errors %}
                <p class="text-red-400 text-xs mt-1">{{ form.email.errors.0 }}</p>
                {% endif %}
            </div>
            <button type="submit" class="w-full grm-btn-primary py-2">
                Send Reset Link
            </button>
        </form>

        <p class="text-center text-gray-300 text-sm mt-6">
            <a href="{% url 'accounts:login' %}" class="text-blue-400 hover:text-blue-300">← Back to Sign In</a>
        </p>
    </div>
</body>
</html>
