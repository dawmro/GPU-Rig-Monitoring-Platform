{% load gpu_filters %}
<span id="rig-status-badge">
    {% if rig.status == 'online' %}
    <span class="grm-badge grm-badge-online px-3 py-1 text-sm">Online</span>
    {% elif rig.status == 'stale' %}
    <span class="grm-badge grm-badge-stale px-3 py-1 text-sm">Stale</span>
    {% else %}
    <span class="grm-badge grm-badge-offline px-3 py-1 text-sm">Offline</span>
    {% endif %}
</span>
<span class="grm-text-muted text-sm ml-3" id="rig-last-payload">
    {% if rig.last_seen %}Last payload: {{ rig.last_seen|last_seen_short }} ago{% else %}No payload{% endif %}
</span>
