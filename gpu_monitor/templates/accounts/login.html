{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="grm-card-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">🖥️ GPU Rig Monitor</h1>
        {% if messages %}
        {% for message in messages %}
        <div class="grm-alert grm-alert-error mb-4">{{ message }}</div>
        {% endfor %}
        {% endif %}
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm grm-text-gray mb-1">Email</label>
                <input type="email" name="email" required
                    class="w-full grm-input-lg">
            </div>
            <div>
                <div class="flex items-center justify-between">
                    <label class="block text-sm grm-text-gray mb-1">Password</label>
                    <a href="{% url 'accounts:password-reset' %}" class="text-xs grm-text-blue hover:grm-text-blue-light">Forgot password?</a>
                </div>
                <input type="password" name="password" required
                    class="w-full grm-input-lg">
            </div>
            <button type="submit" class="w-full grm-btn-primary py-2">
                Sign In
            </button>
        </form>
        <p class="text-center grm-text-gray text-sm mt-6">
            Don't have an account?
            <a href="{% url 'accounts:register' %}" class="grm-text-blue hover:grm-text-blue-light">Create Account</a>
        </p>
    </div>
</div>
{% endblock %}
