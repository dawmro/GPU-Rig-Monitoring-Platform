{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Rig Monitor - Password Reset Complete</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
    <div class="grm-card-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-2">🖥️ GPU Rig Monitor</h1>

        <div class="grm-alert grm-alert-success mb-4">
            <p class="text-sm">Your password has been set. You can now sign in with your new password.</p>
        </div>

        <a href="{% url 'accounts:login' %}" class="block w-full grm-btn-primary py-2 text-center">
            Sign In
        </a>
    </div>
</body>
</html>
