{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Rig Monitor - Reset Email Sent</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
    <div class="grm-card-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-2">🖥️ GPU Rig Monitor</h1>
        <p class="grm-text-gray text-center mb-6">Check your email</p>

        <div class="grm-alert grm-alert-success mb-4">
            <p class="text-sm">We've sent you a password reset link. Check your email inbox (and spam folder).</p>
        </div>

        <p class="grm-text-gray text-sm text-center">
            Didn't receive the email? Make sure you entered the correct email address, or
            <a href="{% url 'accounts:password-reset' %}" class="grm-text-blue hover:grm-text-blue-light">try again</a>.
        </p>

        <p class="text-center grm-text-gray text-sm mt-6">
            <a href="{% url 'accounts:login' %}" class="grm-text-blue hover:grm-text-blue-light">← Back to Sign In</a>
        </p>
    </div>
</body>
</html>
