server {
    listen 80;
    server_name monitor.example.com;

    client_max_body_size 2m;

    location /static/ {
        alias /opt/gpu_monitor/staticfiles/;
        expires 1d;
    }

    # Agent auto-update files — served directly by nginx (no Django proxy)
    # These are updated by sync_to_opt.sh on each deploy
    location = /agent/run.py {
        alias /opt/monitoring-agent/run.py;
        add_header Content-Type text/plain;
    }
    location = /agent/check_update.py {
        alias /opt/monitoring-agent/check_update.py;
        add_header Content-Type text/plain;
    }
    location = /agent_windows/run.py {
        alias /opt/agent_windows/run.py;
        add_header Content-Type text/plain;
    }
    location = /agent_windows/check_update.py {
        alias /opt/agent_windows/check_update.py;
        add_header Content-Type text/plain;
    }

    location /api/v1/ingest/ {
        limit_req zone=rig burst=3 nodelay;
        limit_req zone=ip burst=50 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Rig-UUID $http_x_rig_uuid;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
